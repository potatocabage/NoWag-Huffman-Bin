# Huffman encoding configuration for binned compression
# This config defines parameters for applying Huffman encoding to scalar quantization codebooks

# Model configuration
model:
  name: "Meta-Llama-3-8B"  # Set to "grid" to automatically discover all models
  layer_name: "layer_0/self_attn.q_proj"  # Set to "grid" to automatically discover all layers
  weight_path: "./models/meta-llama/Meta-Llama-3-8B/original_weights/layer_0/self_attn.q_proj.pt"  # Base directory for weights
  hessian_path: "./models/meta-llama/Meta-Llama-3-8B/hessianDiags/seed_0/pajama/128/layer_0/self_attn.q_proj.pt"  # Base directory for hessians
  # name: "grid"  # Set to "grid" to automatically discover all models
  # layer_name: "grid"  # Set to "grid" to automatically discover all layers
  # weight_path: "./models/meta-llama/Meta-Llama-3-8B/original_weights"  # Base directory for weights
  # hessian_path: "./models/meta-llama/Meta-Llama-3-8B/hessianDiags/seed_0/pajama/128"  # Base directory for hessians

# Compression configuration
compression:
  severity: grid  # Number of bits smaller the Huffman encoded codebook should be
  # For example: if original is 4-bit, severity 1.5 means target 2.5 bits average

# Huffman encoding parameters
huffman:
  strategy: "HuffmanStrategy"  # Options: "HuffmanStrategy", "DaHuffmanStrategy"
  bin_size: grid
  heuristic_metric: "output_normed_sum"  # Options: "sum", "output_normed_sum"
  heuristic_algo: "min_max"  # Options: "round_robin", "min_max"
  lsa_metric: "num_violation"  # Options: "bit_violation", "num_violation"
  lsa_prep: "none"  # Options: "none", "flip", "shuffle"
  heuristic: true  # Whether to apply heuristic-based permutation
  lsa: false  # Whether to apply LSA-based permutation

# Device configuration
device:
  cuda_device: 0  # List of available CUDA devices for parallel execution
  cuda_launch_blocking: true  # Set CUDA_LAUNCH_BLOCKING=1 for better error messages

# Random seed
seed: 42

# Logging configuration
logging:
  level: "INFO"  # Options: "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"

# Grid search configuration
grid_search:
  enabled: true  # Set to true to enable grid search
  max_parallel_processes: 4  # Maximum number of parallel processes
  base_model_path: "./models"  # Base path to scan for models
  base_hessian_path: "./models"  # Base path to scan for hessian files
  # Parameters that can be set to "grid" for automatic expansion:
  # - model.name: scans base_model_path for available models
  # - model.layer_name: scans each model for available layers
  # - compression.severity: generates values from 0.25 to 2.0 in steps of 0.25
  # - huffman.bin_size: generates powers of 2 up to num_columns/2
  # - huffman.heuristic_metric: ["sum", "output_normed_sum"]
  # - huffman.heuristic_algo: ["round_robin", "min_max"]
  # - huffman.lsa_metric: ["bit_violation", "num_violation"]
  # - huffman.lsa_prep: ["none", "flip", "shuffle"]
  # - huffman.heuristic: [true, false]
  # - huffman.lsa: [true, false]

# Output configuration
output:
  base_dir: "huffman_outputs"
  save_matrices: true  # Whether to save permuted bit count matrices
  save_plots: true  # Whether to save visualization plots
  save_metrics: true  # Whether to save detailed metrics
  save_sanity_checks: true  # Whether to save sanity check results
